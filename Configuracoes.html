<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Acompanhamento de Demandas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="wrapper">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-brand">
                <div class="logo-icon">DT</div>
                <span style="font-size: 0.9rem; line-height: 1.1;">Sistema de Acompanhamento<br>de Demandas</span>
            </div>
            <div class="mt-3">
                <a href="Dashbord.html" class="nav-link">
                    <i class="fa-solid fa-border-all"></i> Painel
                </a>
                <a href="Front_telademanda.html" class="nav-link">
                    <i class="fa-regular fa-clipboard"></i> Demandas
                </a>
                <a href="Configuracoes.html" class="nav-link active">
                    <i class="fa-solid fa-gear"></i> Configurações
                </a>
                <a href="Front_telalogin.html" class="nav-link mt-5 text-danger">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Sair
                </a>
            </div>
        </div>
        <!-- Main Content -->
        <div class="main-content">
            <div class="topbar">
                <h5 class="m-0 text-dark">Configurações</h5>
                <div class="user-info">
                    Bem-vindo, Usuário
                    <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
                </div>
            </div>
            <div class="p-4">
                <div class="card card-custom p-4 mb-4">
                    <h4 class="mb-4 text-dark fw-normal"><i class="fa-solid fa-user-gear me-2"></i> Perfil do Usuário</h4>
                    <form novalidate>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label text-muted">Nome Completo</label>
                                <input type="text" class="form-control" value="Usuário Exemplo">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted">E-mail</label>
                                <input type="email" class="form-control" value="usuario@teste.com">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label text-muted">Cargo / Perfil</label>
                                <select class="form-select">
                                    <option value="Administrador">Administrador</option>
                                    <option value="Líder de Projeto">Líder de Projeto</option>
                                    <option value="Membro da Equipe" selected>Membro da Equipe</option>
                                </select>
                            </div>
                        </div>
                        <div class="d-flex justify-content-end mt-3">
                            <button type="button" class="btn btn-primary" style="background-color: #1e73be; border: none;">Salvar Perfil</button>
                        </div>
                    </form>
                </div>

                <div class="card card-custom p-4">
                    <h4 class="mb-4 text-dark fw-normal"><i class="fa-solid fa-bell me-2"></i> Preferências do Sistema</h4>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="notifEmail" checked>
                        <label class="form-check-label text-muted" for="notifEmail">Receber notificações por e-mail ao ser atribuído a uma demanda</label>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="notifStatus">
                        <label class="form-check-label text-muted" for="notifStatus">Receber notificações de mudança de status</label>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="darkMode">
                        <label class="form-check-label text-muted" for="darkMode">Ativar Modo Escuro (Dark Mode)</label>
                    </div>
                    <hr class="text-secondary mt-4 mb-3">
                    <div class="d-flex justify-content-end">
                        <button type="button" class="btn btn-primary" style="background-color: #1e73be; border: none;">Salvar Preferências</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
