<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Usuário - Acompanhamento de Demandas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="wrapper">
        <!-- Barra lateral de navegacao -->
        <div class="sidebar">
            <div class="sidebar-brand">
                <div class="logo-icon">DT</div>
                <span style="font-size: 0.9rem; line-height: 1.1;">Sistema de Acompanhamento<br>de Demandas</span>
            </div>
            <div class="mt-3">
                <a href="Dashbord.html" class="nav-link">
                    <i class="fa-solid fa-border-all"></i> Painel
                </a>
                <a href="Front_telademanda.html" class="nav-link">
                    <i class="fa-regular fa-clipboard"></i> Demandas
                </a>
                <a href="Configuracoes.html" class="nav-link active">
                    <i class="fa-solid fa-gear"></i> Configurações
                </a>
                <a href="Front_telalogin.html" class="nav-link mt-5 text-danger">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Sair
                </a>
            </div>
        </div>

        <div class="main-content">
            <div class="topbar">
                <h5 class="m-0 text-dark">Perfil e Configurações</h5>
                <div class="user-info" id="topbarUsuario">
                    Carregando...
                    <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
                </div>
            </div>

            <!-- Dados do usuario autenticado e projetos vinculados -->
            <div class="p-4">
                <div class="card card-custom p-4 mb-4">
                    <h4 class="mb-4 text-dark fw-normal"><i class="fa-solid fa-user-gear me-2"></i> Dados do Usuário Autenticado</h4>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label text-muted">Nome Completo</label>
                            <input type="text" id="perfilNome" class="form-control" readonly>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-muted">E-mail</label>
                            <input type="email" id="perfilEmail" class="form-control" readonly>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-muted">Perfil de Acesso</label>
                            <input type="text" id="perfilTipo" class="form-control" readonly>
                        </div>
                    </div>
                    <small class="text-muted">Os dados e permissões de acesso são gerenciados no banco de dados da aplicação.</small>
                </div>

                <div class="card card-custom p-4">
                    <h4 class="mb-3 text-dark fw-normal" id="tituloProjetosUsuario"><i class="fa-solid fa-folder-open me-2"></i> Projetos Vinculados</h4>
                    <ul id="listaProjetosUsuario" class="list-group list-group-flush">
                        <li class="list-group-item text-muted">Carregando projetos...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/Configuracoes.js"></script>
</body>
</html>
