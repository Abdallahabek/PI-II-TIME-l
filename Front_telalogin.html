<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Acompanhamento de Demandas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            background-color: #f0f4f8;
            background-image: radial-gradient(#d1d8e0 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            background-color: white;
            border: none;
        }
        .login-logo {
            background-color: #e2e8f0;
            color: #475569;
            font-size: 2rem;
            font-weight: bold;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            border-radius: 8px;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card login-card text-center">
        <div class="login-logo">DT</div>
        <h5 class="mb-4 text-dark fw-normal">Sistema de Acompanhamento de Demandas - Login</h5>

        <form id="loginForm" novalidate>
            <div id="loginErro" class="alert alert-danger d-none text-start py-2" role="alert"></div>

            <div class="input-group mb-3">
                <span class="input-group-text bg-white"><i class="fa-regular fa-envelope text-muted"></i></span>
                <input type="email" id="email" class="form-control border-start-0 ps-0" placeholder="E-mail" required>
            </div>

            <div class="input-group mb-4">
                <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-muted"></i></span>
                <input type="password" id="senha" class="form-control border-start-0 ps-0" placeholder="Senha" required>
            </div>

            <button type="submit" id="btnEntrar" class="btn btn-primary w-100 mb-3" style="background-color: #1e73be; border: none;">Entrar</button>

            <small class="text-muted d-block">Acesso para usuarios pre-cadastrados no sistema.</small>
        </form>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/Login.js"></script>
</body>
</html>
