<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro/Edicao de Demanda - Acompanhamento de Demandas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="wrapper">
        <!-- Barra lateral -->
        <div class="sidebar">
            <div class="sidebar-brand">
                <div class="logo-icon">DT</div>
                <span style="font-size: 0.9rem; line-height: 1.1;">Sistema de Acompanhamento<br>de Demandas</span>
            </div>
            <div class="mt-3">
                <a href="Dashbord.html" class="nav-link">
                    <i class="fa-solid fa-border-all"></i> Painel
                </a>
                <a href="Front_telademanda.html" class="nav-link active">
                    <i class="fa-regular fa-clipboard"></i> Demandas
                </a>
                <a href="Configuracoes.html" class="nav-link">
                    <i class="fa-solid fa-gear"></i> Configuracoes
                </a>
                <a href="Front_telalogin.html" class="nav-link mt-5 text-danger">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Sair
                </a>
            </div>
        </div>

        <!-- Conteudo principal -->
        <div class="main-content">
            <div class="topbar">
                <h5 class="m-0 text-dark">Gerenciamento de Demanda</h5>
                <div class="user-info" id="topbarUsuario">
                    Carregando...
                    <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
                </div>
            </div>

            <div class="p-4">
                <div class="mb-3">
                    <a href="Front_telademanda.html" class="text-decoration-none text-muted">
                        <i class="fa-solid fa-arrow-left me-1"></i> Voltar para Demandas
                    </a>
                </div>

                <div class="card card-custom p-4">
                    <h4 class="mb-4 text-dark fw-normal" id="tituloFormulario">Nova Demanda</h4>

                    <div id="formErro" class="alert alert-danger d-none" role="alert"></div>

                    <form id="demandaForm" novalidate>
                        <div class="mb-3">
                            <label for="titulo" class="form-label text-muted">Titulo da Demanda</label>
                            <input type="text" class="form-control" id="titulo" placeholder="Ex: Ajuste no fluxo de login" required>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-3">
                                <label for="projetoId" class="form-label text-muted">Projeto</label>
                                <select class="form-select" id="projetoId" required>
                                    <option value="">Carregando projetos...</option>
                                </select>
                            </div>

                            <div class="col-md-3">
                                <label for="responsavelId" class="form-label text-muted">Responsavel (opcional)</label>
                                <select class="form-select" id="responsavelId">
                                    <option value="">Sem responsavel</option>
                                </select>
                            </div>

                            <div class="col-md-2">
                                <label class="form-label text-muted">Tipo de Demanda</label>
                                <div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="tipo" id="tipoDefeito" value="Defeito" checked required>
                                        <label class="form-check-label" for="tipoDefeito">Defeito</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="tipo" id="tipoTarefa" value="Tarefa">
                                        <label class="form-check-label" for="tipoTarefa">Tarefa</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="tipo" id="tipoMelhoria" value="Melhoria">
                                        <label class="form-check-label" for="tipoMelhoria">Melhoria</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="tipo" id="tipoDocumentacao" value="Documentação">
                                        <label class="form-check-label" for="tipoDocumentacao">Documentacao</label>
                                    </div>
                                </div>
                            </div>

                            <div class="col-md-2">
                                <label for="prioridade" class="form-label text-muted">Prioridade</label>
                                <select class="form-select" id="prioridade" required>
                                    <option value="">Selecione...</option>
                                    <option value="Crítica">Critica</option>
                                    <option value="Alta">Alta</option>
                                    <option value="Média">Media</option>
                                    <option value="Baixa">Baixa</option>
                                </select>
                            </div>

                            <div class="col-md-2">
                                <label for="prazoFinalizacao" class="form-label text-muted">Prazo (opcional)</label>
                                <input type="date" class="form-control" id="prazoFinalizacao">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="descricao" class="form-label text-muted">Descricao Detalhada</label>
                            <textarea class="form-control" rows="5" id="descricao" placeholder="Descreva a demanda..." required></textarea>
                        </div>

                        <hr class="text-secondary">
                        <div class="d-flex justify-content-end">
                            <a href="Front_telademanda.html" class="btn btn-secondary me-2 bg-secondary border-0">Cancelar</a>
                            <button type="submit" id="btnSalvar" class="btn btn-primary" style="background-color: #1e73be; border: none;">Salvar Demanda</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/NovaDemanda.js"></script>
</body>
</html>
