<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Acompanhamento de Demandas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="wrapper">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-brand">
                <div class="logo-icon">DT</div>
                <span style="font-size: 0.9rem; line-height: 1.1;">Sistema de Acompanhamento<br>de Demandas</span>
            </div>
            <div class="mt-3">
                <a href="Dashbord.html" class="nav-link active">
                    <i class="fa-solid fa-border-all"></i> Painel
                </a>
                <a href="Front_telademanda.html" class="nav-link">
                    <i class="fa-regular fa-clipboard"></i> Demandas
                </a>
                <a href="Configuracoes.html" class="nav-link">
                    <i class="fa-solid fa-gear"></i> Configurações
                </a>
                <a href="Front_telalogin.html" class="nav-link mt-5 text-danger">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Sair
                </a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="topbar">
                <h5 class="m-0 text-dark">Bem-vindo, Aluno</h5>
                <div class="user-info">
                    Bem-vindo, Aluno
                    <div class="user-avatar">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>
            </div>

            <div class="p-4">
                <!-- Cards de Metricas Zerados -->
                <div class="row mb-2">
                    <div class="col-md-3">
                        <div class="card card-custom card-metric">
                            <div class="metric-title">Total Demandas</div>
                            <h2 class="metric-value">0</h2>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card card-custom card-metric">
                            <div class="metric-title">Em Andamento</div>
                            <h2 class="metric-value">0</h2>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card card-custom card-metric">
                            <div class="metric-title">Concluídas</div>
                            <h2 class="metric-value">0</h2>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card card-custom card-metric">
                            <div class="metric-title">Aguardando</div>
                            <h2 class="metric-value">0</h2>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <!-- Gráfico de Barras -->
                    <div class="col-md-8">
                        <div class="card card-custom h-100">
                            <div class="card-header-custom">Demandas por Mês</div>
                            <div class="card-body d-flex align-items-center justify-content-center">
                                <!-- Gráfico vazio / zerado -->
                                <canvas id="barChart" height="120"></canvas>
                            </div>
                        </div>
                    </div>

                    <!-- Gráfico de Rosca e Atividade -->
                    <div class="col-md-4">
                        <div class="card card-custom mb-4">
                            <div class="card-header-custom">Status das Demandas</div>
                            <div class="card-body">
                                <canvas id="doughnutChart" height="200"></canvas>
                            </div>
                        </div>

                        <div class="card card-custom">
                            <div class="card-header-custom">Atividade Recente</div>
                            <div class="card-body">
                                <ul class="list-unstyled mb-0" style="font-size: 0.9rem;">
                                    <li class="text-center text-muted py-3">
                                        Nenhuma atividade recente registrada.
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Script para renderizar os gráficos zerados -->
    <script>
        // Lógica de leitura do localStorage
        const demandas = JSON.parse(localStorage.getItem('demandas')) || [];
        
        let abertas = 0;
        let emAndamento = 0;
        let concluidas = 0;

        let alta = 0;
        let media = 0;
        let baixa = 0;

        demandas.forEach(d => {
            if (d.status === 'Aberto') abertas++;
            if (d.status === 'Em Andamento') emAndamento++;
            if (d.status === 'Concluído') concluidas++;

            if (d.prioridade === 'Alta') alta++;
            if (d.prioridade === 'Média') media++;
            if (d.prioridade === 'Baixa') baixa++;
        });

        const total = demandas.length;

        // Gráfico de Barras (Prioridades)
        const ctxBar = document.getElementById('barChart').getContext('2d');
        new Chart(ctxBar, {
            type: 'bar',
            data: {
                labels: ['Alta', 'Média', 'Baixa'],
                datasets: [{
                    label: 'Demandas',
                    data: total === 0 ? [0,0,0] : [alta, media, baixa],
                    backgroundColor: ['#dc3545', '#ffc107', '#198754'],
                    borderColor: ['#b02a37', '#ffcd39', '#146c43'],
                    borderWidth: 1
                }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, suggestedMax: total < 5 ? 5 : total, ticks: { stepSize: 1 } }
                }
            }
        });

        // Gráfico de Rosca (Status)
        const ctxDoughnut = document.getElementById('doughnutChart').getContext('2d');
        const doughnutData = total === 0 ? [1] : [abertas, emAndamento, concluidas];
        const doughnutColors = total === 0 ? ['#f1f5f9'] : ['#0d6efd', '#ffc107', '#198754'];
        const doughnutLabels = total === 0 ? ['Sem dados'] : ['Aberto', 'Em Andamento', 'Concluído'];

        new Chart(ctxDoughnut, {
            type: 'doughnut',
            data: {
                labels: doughnutLabels,
                datasets: [{
                    data: doughnutData,
                    backgroundColor: doughnutColors,
                    borderWidth: 1
                }]
            },
            options: {
                cutout: '60%',
                plugins: {
                    legend: { display: total > 0, position: 'bottom' },
                    tooltip: { enabled: total > 0 }
                }
            }
        });
    </script>
</body>

</html>
