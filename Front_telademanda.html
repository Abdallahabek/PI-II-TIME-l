<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demandas - Acompanhamento de Demandas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="wrapper">
        <div class="sidebar">
            <div class="sidebar-brand">
                <div class="logo-icon">DT</div>
                <span style="font-size: 0.9rem; line-height: 1.1;">Sistema de Acompanhamento<br>de Demandas</span>
            </div>
            <div class="mt-3">
                <a href="Dashbord.html" class="nav-link">
                    <i class="fa-solid fa-border-all"></i> Painel
                </a>
                <a href="Front_telademanda.html" class="nav-link active">
                    <i class="fa-regular fa-clipboard"></i> Demandas
                </a>
                <a href="Configuracoes.html" class="nav-link">
                    <i class="fa-solid fa-gear"></i> Configurações
                </a>
                <a href="Front_telalogin.html" class="nav-link mt-5 text-danger">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i> Sair
                </a>
            </div>
        </div>

        <div class="main-content">
            <div class="topbar">
                <h5 class="m-0 text-dark">Demandas</h5>
                <div class="user-info" id="topbarUsuario">
                    Carregando...
                    <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
                </div>
            </div>

            <div class="p-4">
                <div class="card card-custom p-4">
                    <div class="d-flex justify-content-between flex-wrap gap-2 mb-3">
                        <div class="input-group" style="max-width: 400px;">
                            <span class="input-group-text bg-white"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                            <input type="text" id="searchInput" class="form-control border-start-0 ps-0" placeholder="Pesquisar por título ou descrição...">
                        </div>
                        <div>
                            <button type="button" id="btnLimparFiltros" class="btn btn-light border text-muted me-2">
                                <i class="fa-solid fa-filter-circle-xmark"></i> Limpar filtros
                            </button>
                            <a href="tela_nova_demanda.html" id="btnNovaDemanda" class="btn btn-primary d-none" style="background-color: #1e73be; border: none;">+ Nova Demanda</a>
                        </div>
                    </div>

                    <div class="row g-2 mb-4">
                        <div class="col-md-2">
                            <label for="filtroStatus" class="form-label small text-muted mb-1">Status</label>
                            <select id="filtroStatus" class="form-select form-select-sm">
                                <option value="">Todos</option>
                                <option value="Aberta">Aberta</option>
                                <option value="Em andamento">Em andamento</option>
                                <option value="Em revisão">Em revisão</option>
                                <option value="Concluída">Concluída</option>
                                <option value="Cancelada">Cancelada</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label for="filtroPrioridade" class="form-label small text-muted mb-1">Prioridade</label>
                            <select id="filtroPrioridade" class="form-select form-select-sm">
                                <option value="">Todas</option>
                                <option value="Crítica">Crítica</option>
                                <option value="Alta">Alta</option>
                                <option value="Média">Média</option>
                                <option value="Baixa">Baixa</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label for="filtroTipo" class="form-label small text-muted mb-1">Tipo</label>
                            <select id="filtroTipo" class="form-select form-select-sm">
                                <option value="">Todos</option>
                                <option value="Tarefa">Tarefa</option>
                                <option value="Defeito">Defeito</option>
                                <option value="Melhoria">Melhoria</option>
                                <option value="Documentação">Documentação</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label for="filtroProjeto" class="form-label small text-muted mb-1">Projeto</label>
                            <select id="filtroProjeto" class="form-select form-select-sm">
                                <option value="">Todos</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label for="filtroResponsavel" class="form-label small text-muted mb-1">Responsável</label>
                            <select id="filtroResponsavel" class="form-select form-select-sm">
                                <option value="">Todos</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label for="ordenarPor" class="form-label small text-muted mb-1">Ordenar por</label>
                            <select id="ordenarPor" class="form-select form-select-sm">
                                <option value="dataCriacao">Data de criação</option>
                                <option value="prioridade">Prioridade</option>
                                <option value="prazoFinalizacao">Prazo de finalização</option>
                                <option value="status">Status</option>
                            </select>
                        </div>
                    </div>

                    <div id="alertaErro" class="alert alert-danger d-none" role="alert"></div>

                    <div class="table-responsive">
                        <table class="table table-hover table-custom">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Título</th>
                                    <th>Tipo</th>
                                    <th>Projeto</th>
                                    <th>Responsável</th>
                                    <th>Status</th>
                                    <th>Prioridade</th>
                                    <th>Data de Criação</th>
                                    <th>Prazo de Finalização</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabelaDemandas"></tbody>
                        </table>
                    </div>

                    <div class="text-muted small mt-2" id="totalDemandas"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/ListaDemandas.js"></script>
</body>
</html>
